# cargo-deny configuration for tpt-cli.
#
# Licence policy (see README, "Licensing"):
#   * Allow permissive licences: MIT, ISC, BSD-2/3, Zlib, Unicode-3.0, CC0-1.0, Unlicense.
#   * Apache-2.0 is allowed only as one option of an OR expression (for example
#     "MIT OR Apache-2.0"). It is NOT allowed on its own, and not in AND expressions.
#   * Deny copyleft (GPL, LGPL, AGPL), MPL and CDLA.
#   * Each exception below is documented and must be justified.

[graph]
# Check the dependency tree for every target platform.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false
no-default-features = false

[licenses]
version = 2
confidence-threshold = 0.93
# Only permissive licences from the allowlist. Apache-2.0 is deliberately absent.
# A dual "X OR Apache-2.0" licence is satisfied by X, so it passes without Apache-2.0 here.
allow = [
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]

# Exceptions, each one a single crate. Keep this list short.
#
# ring was removed (todo.md Phase 9). The TLS provider is now the pure-Rust
# tpt-crypto-rustls, so no "Apache-2.0 AND ISC" exception is needed.

# No licence exceptions remain. ring and sync_wrapper went with the reqwest replacement
# (todo.md Phase 9). ryu is an OR licence and passes the policy without an exception.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Block C and OpenSSL-based crypto, and ring, so the tree stays free of C and of ring.
deny = [
    { name = "openssl-sys", reason = "No C dependencies: rustls only." },
    { name = "openssl", reason = "No C dependencies: rustls only." },
    { name = "aws-lc-sys", reason = "No C dependencies: TLS crypto comes from tpt-crypto-rustls." },
    { name = "aws-lc-rs", reason = "No C dependencies: TLS crypto comes from tpt-crypto-rustls." },
    { name = "ring", reason = "Replaced by the pure-Rust tpt-crypto-rustls provider (todo.md Phase 9)." },
]
skip = []
skip-tree = []

[advisories]
version = 2
ignore = [
    # rsa 0.9 via tpt-crypto-rustls, which uses it for server-certificate verification
    # (public-key operations) only. No private-key operations are performed here.
    # Removed when tpt-crypto gains RSA verification (todo.md Phase 9). Review by 2027-02-10.
    { id = "RUSTSEC-2023-0071", reason = "rsa via tpt-crypto-rustls; verification only, no private-key operations; review by 2027-02-10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The TLS provider and its crypto substrate, both TPT Solutions repos, pinned by rev in Cargo.toml.
allow-git = [
    "https://github.com/tpt-solutions/tpt-crypto-rustls",
    "https://github.com/tpt-solutions/tpt-crypto",
]
