[package]
name = "tpt-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Permissively licensed framework and `tpt` binary for building agent-friendly command-line interfaces."
repository = "https://github.com/TPT-Solutions/tpt-cli"
readme = "README.md"
keywords = ["cli", "config", "json", "agents"]
categories = ["command-line-interface", "command-line-utilities"]

[lib]
name = "tpt"
path = "src/lib.rs"

[[bin]]
name = "tptcli"
path = "src/main.rs"
required-features = ["net"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["derive", "env", "help", "std"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", optional = true }
http = { version = "1.5.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
url = { version = "2.5.8", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
# Pure-Rust TLS crypto provider for rustls (unaudited; see README and SECURITY.md).
tpt-crypto-rustls = { version = "0.1.0", git = "https://github.com/tpt-solutions/tpt-crypto-rustls", rev = "e6b5fcbb6a872d5e6fde507f29d21e576bac46e6", optional = true }

[features]
default = ["net", "prompts"]
# HTTP client over rustls, with the tpt-crypto TLS provider. Contains no ring and no C crypto.
net = ["dep:http", "dep:rustls", "dep:rustls-native-certs", "dep:tpt-crypto-rustls", "dep:url"]
# Interactive prompts via dialoguer.
prompts = ["dep:dialoguer"]

[profile.release]
# Size-first release profile. Benchmark opt-level = 3 against "z" before changing it.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
