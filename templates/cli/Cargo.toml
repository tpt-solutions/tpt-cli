[package]
name = "{{ project-name }}"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "{{ app_name }}: a command-line tool built on the TPT framework"
license = "MIT OR Apache-2.0"

[dependencies]
# The TPT framework: layered config, JSON envelope, typed errors and the schema command.
# Pin a release tag once one is published, for example tag = "v0.1.0".
tpt = { package = "tpt-cli", git = "https://github.com/TPT-Solutions/tpt-cli", branch = "master" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
